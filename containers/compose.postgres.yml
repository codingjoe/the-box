version: "3.8"
services:
  postgres:
    image: supabase/postgres:17.5.1.070-orioledb
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app
      - caddy
    labels:
      - "caddy_0=pg.${HOSTNAME:-localhost}"
      - "caddy_0.respond=OK 200"
      - "caddy_1.layer4.:5432.@pg_tls.postgres.tls=enabled"
      - "caddy_1.layer4.:5432.route_0=@pg_tls"
      - "caddy_1.layer4.:5432.route_0.postgres_tls="
      - "caddy_1.layer4.:5432.route_0.tls="
      - "caddy_1.layer4.:5432.route_0.proxy={{upstreams 5432}}"
      - "caddy_1.layer4.:5432.@pg_plain.postgres.tls=disabled"
      - "caddy_1.layer4.:5432.route_1=@pg_plain"
      - "caddy_1.layer4.:5432.route_1.proxy={{upstreams 5432}}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  web:
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
volumes:
  postgres:
