name: the-box-postgres
services:
  postgres:
    image: postgres:18.6
    volumes:
      # PostgreSQL 18 images use a major version specific PGDATA and expect a mount at /var/lib/postgresql
      - postgres:/var/lib/postgresql
    configs:
      - source: pg_stat_statements
        target: /docker-entrypoint-initdb.d/10-pg_stat_statements.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app
      - ingress
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels:
      - "caddy=pg.${HOSTNAME:-localhost}"
      - "caddy.respond=OK"
      - "dev.dozzle.url=postgresql://postgres:${POSTGRES_PASSWORD}@pg.${HOSTNAME:-localhost}:443/postgres?sslmode=require"
      - 'caddy_1.servers.listener_wrappers.0_layer4.@pg_tls.postgres.tls=enabled'
      - 'caddy_1.servers.listener_wrappers.0_layer4.route_0=@pg_tls'
      - 'caddy_1.servers.listener_wrappers.0_layer4.route_0.0_postgres_tls='
      - 'caddy_1.servers.listener_wrappers.0_layer4.route_0.1_tls.connection_policy.alpn=postgresql'
      - 'caddy_1.servers.listener_wrappers.0_layer4.route_0.2_proxy={{upstreams 5432}}'
      - 'caddy_1.servers.listener_wrappers.1_tls='
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    memswap_limit: 2g
  web:
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
volumes:
  postgres:
configs:
  pg_stat_statements:
    content: |
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
