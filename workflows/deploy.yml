name: Deploy
on:
  workflow_run:
    workflows: [CI]
    strategy: wait-all
    timeout: 0
    branches: [main]
    types:
      - completed
  workflow_dispatch: # Allow manual trigger
# Deploy one run at a time per branch, so overlapping runs cannot race the
# same compose project. Deploys of different branches run in parallel.
concurrency:
  group: ${{ github.head_ref || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  paas:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: codingjoe/the-box/actions/deploy@main
        with:
          ssh-host: ${{ vars.SSH_HOSTNAME }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hostname: ${{ vars.HOSTNAME }}
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          environment: ${{ github.environment }}
