name: "Docker Compose"
description: "Update Docker Compose plugin."
branding:
  icon: 'anchor'
  color: 'blue'
inputs:
  version:
    description: "Version of Docker Compose plugin to update to (e.g., 2.27.1)"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    - shell: sh
      run: |
        case "$(uname -m)" in
          x86_64 | amd64) arch=x86_64 ;;
          aarch64 | arm64) arch=aarch64 ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        if [ "${{ inputs.version }}" = "latest" ]; then
          url="https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${arch}"
        else
          url="https://github.com/docker/compose/releases/download/${{ inputs.version }}/docker-compose-linux-${arch}"
        fi
        sudo curl -sSLo "/usr/libexec/docker/cli-plugins/docker-compose" "$url"
