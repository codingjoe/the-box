name: "Annotate OCI artifact"
description: "Set OCI annotations, such as a description, on a published artifact manifest."
branding:
  icon: 'tag'
  color: 'blue'
inputs:
  reference:
    description: "Artifact reference to annotate, for example ghcr.io/owner/name:tag."
    required: true
  description:
    description: "Human readable description of the artifact."
    required: true
  source:
    description: "Source repository URL."
    required: false
    default: 'https://github.com/${{ github.repository }}'
  url:
    description: "Project website."
    required: false
    default: 'https://the-box.sh'
  version:
    description: "Version of the artifact."
    required: false
    default: '${{ github.ref_name }}'
  revision:
    description: "Git revision the artifact was built from."
    required: false
    default: '${{ github.sha }}'
  licenses:
    description: "License of the artifact."
    required: false
    default: "BSD-2-Clause"
  version-cli:
    description: "Version of the ORAS CLI to install (e.g., 1.3.4)."
    required: false
    default: "1.3.4"
runs:
  using: "composite"
  steps:
    - name: Install ORAS
      shell: sh
      run: |
        case "$(uname -m)" in
          x86_64 | amd64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        curl -fsSL "https://github.com/oras-project/oras/releases/download/v${{ inputs.version-cli }}/oras_${{ inputs.version-cli }}_linux_${arch}.tar.gz" | sudo tar -xz -C /usr/local/bin oras
    - name: Annotate manifest
      shell: sh
      env:
        REFERENCE: ${{ inputs.reference }}
        DESCRIPTION: ${{ inputs.description }}
        SOURCE: ${{ inputs.source }}
        URL: ${{ inputs.url }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        LICENSES: ${{ inputs.licenses }}
      run: |
        set -eu
        manifest="$(mktemp)"
        oras manifest fetch "${REFERENCE}" > "${manifest}"
        jq \
          --arg description "${DESCRIPTION}" \
          --arg source "${SOURCE}" \
          --arg url "${URL}" \
          --arg version "${VERSION}" \
          --arg revision "${REVISION}" \
          --arg licenses "${LICENSES}" \
          '.annotations = ((.annotations // {}) + {
            "org.opencontainers.image.description": $description,
            "org.opencontainers.image.source": $source,
            "org.opencontainers.image.url": $url,
            "org.opencontainers.image.version": $version,
            "org.opencontainers.image.revision": $revision,
            "org.opencontainers.image.licenses": $licenses
          })' "${manifest}" > "${manifest}.annotated"
        mv "${manifest}.annotated" "${manifest}"
        oras manifest push "${REFERENCE}" "${manifest}"
