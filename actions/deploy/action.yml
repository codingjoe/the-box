name: Deploy
description: 'Deploy the application to the production server over SSH using Docker Compose. Pulls the pre-built images published by the CI workflow. Traffic facing services are rolled out without downtime, others are recreated gracefully. Services are never built on the server, which keeps the load on small servers low.'
branding:
  icon: 'anchor'
  color: 'blue'
inputs:
  ssh-host:
    description: 'The hostname or IP address of the production server (e.g., "example.com").'
    required: true
  ssh-known-hosts:
    description: 'The SSH known hosts entry for the production server (e.g., "github.com ssh-rsa ...").'
    required: true
  ssh-private-key:
    description: 'The SSH private key to use for connecting to the production server. This should be stored as a secret in the repository.'
    required: true
  dotenv-private-key:
    description: 'The private key to use for decrypting secrets in the .env file on the production server. This should be stored as a secret in the repository.'
    required: true
  environment:
    description: 'The target environment for deployment (e.g., "production"). This will be used to determine which .env file to use and can also be used for environment-specific configurations.'
    required: true
  hostname:
    description: 'The domain to use for the application deployment (e.g., "example.com").'
    required: true
  rollout-services:
    description: 'Space-separated services to update without downtime. They must not publish host ports or define a container name. All other services are recreated gracefully. Set to an empty string for apps without a web service.'
    required: false
    default: 'web'
  rollout-timeout:
    description: 'Seconds to wait for new rollout containers to become healthy before rolling back. Must exceed the healthcheck start_period plus interval times retries.'
    required: false
    default: '120'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Pin known hosts
      run: |
        echo "::group::Pinning known hosts"
        echo "${{ inputs.ssh-known-hosts }}" >> ~/.ssh/known_hosts
        echo "::debug::Known hosts updated:"
        cat ~/.ssh/known_hosts
        echo "::endgroup::"
      shell: sh
    - name: Setting up Docker context for remote deployment
      run: |
        docker context create the-box --description "The Box" --docker "host=ssh://github@${{ inputs.ssh-host }}"
        docker context use the-box
      shell: sh
    - uses: codingjoe/the-box/actions/compose@main
    - uses: codingjoe/the-box/actions/rollout@main
    - name: Install dotenvx
      shell: sh
      run: |
        curl -fsSL https://dotenvx.sh | sh
        cp .env.${{ inputs.environment }} .env
    - name: Deploy application to the box
      run: dotenvx run -- sh ${{ github.action_path }}/deploy.sh
      shell: sh
      env:
        COMPOSE_FILE: compose.${{ inputs.environment }}.yml
        PROJECT_NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}
        ROLLOUT_SERVICES: ${{ inputs.rollout-services }}
        ROLLOUT_TIMEOUT: ${{ inputs.rollout-timeout }}
        HOSTNAME: ${{ inputs.hostname }}
        DOTENV_PRIVATE_KEY: ${{ inputs.dotenv-private-key }}
        IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
