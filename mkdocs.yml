site_name: The Box
site_url: https://the-box.sh/
repo_url: https://github.com/codingjoe/the-box
repo_name: codingjoe/the-box
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
nav:
  - Home: index.md
  - Deployment: deployment.md
  - Scaling: scaling.md
  - Monitoring: monitoring.md
  - Environment: environment.md
  - Backups: backups.md
  - File Storage: storage.md
markdown_extensions:
  - markdown_gfm_admonition
  - admonition
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - footnotes
