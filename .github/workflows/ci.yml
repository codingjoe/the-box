name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  container:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        container:
          - caddy
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.container }}
          file: containers/${{ matrix.container }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  oci-artifacts-app:
    name: OCI artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - postgres
          - redis
    steps:
      - uses: actions/checkout@v7
      - uses: codingjoe/the-box/actions/compose@main
      - run: docker compose --file containers/compose.web.yml --file containers/compose.${{ matrix.service }}.yml publish --yes --dry-run ghcr.io/${{ github.repository_owner }}/the-box-${{ matrix.service }}:${{ github.ref_name }}
  oci-artifacts-box:
    name: OCI artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codingjoe/the-box/actions/compose@main
      - run: docker compose --file containers/compose.yml publish --yes --dry-run ghcr.io/${{ github.repository_owner }}/the-box:${{ github.ref_name }}
