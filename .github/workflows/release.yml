name: Release
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  containers:
    name: Push image to GitHub Container Registry
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      packages: write
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: containers/caddy
      file: containers/caddy/Dockerfile
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/the-box-caddy
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest
      cache: true
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  oci-artifacts-app:
    name: OCI artifact
    needs: [containers]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - postgres
          - redis
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: codingjoe/the-box/actions/compose@main
      - run: docker compose --file containers/compose.web.yml --file containers/compose.${{ matrix.service }}.yml publish --yes ghcr.io/${{ github.repository_owner }}/the-box-${{ matrix.service }}:${{ github.ref_name }}
      - name: Get image version
        id: image-version
        run: |
          image="$(awk '$1 == "image:" {print $2; exit}' containers/compose.${{ matrix.service }}.yml)"
          echo "version=${image##*:}" >> "$GITHUB_OUTPUT"
      - uses: codingjoe/the-box/actions/annotate@main
        with:
          reference: ghcr.io/${{ github.repository_owner }}/the-box-${{ matrix.service }}:${{ github.ref_name }}
          description: The Box ${{ matrix.service }} compose stack
          version: ${{ steps.image-version.outputs.version }}
  oci-artifacts-box:
    name: OCI artifact
    needs: [containers]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: codingjoe/the-box/actions/compose@main
      - run: docker compose --file containers/compose.yml publish --yes ghcr.io/${{ github.repository_owner }}/the-box:${{ github.ref_name }}
      - uses: codingjoe/the-box/actions/annotate@main
        with:
          reference: ghcr.io/${{ github.repository_owner }}/the-box:${{ github.ref_name }}
          description: The Box compose stack
